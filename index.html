<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Spiral Spinner</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root { --bg1:#f4efe6; --bg2:#d9cdb8; --ink:#2b2620; --panel:rgba(255,255,255,.78); }
  @media (prefers-color-scheme: dark) { :root { --bg1:#2a2723; --bg2:#14120f; --ink:#f1ebe0; --panel:rgba(30,27,24,.78); } }
  html,body { margin:0; height:100%; overflow:hidden; font-family:system-ui,sans-serif; color:var(--ink);
    background:radial-gradient(ellipse at 50% 30%, var(--bg1), var(--bg2)); }
  canvas { display:block; width:100%; height:100%; cursor:grab; }
  canvas:active { cursor:grabbing; }
  #ui { position:fixed; right:16px; top:50%; transform:translateY(-50%); width:210px; max-height:calc(100vh - 90px); overflow-y:auto;
    padding:14px 16px; background:var(--panel); backdrop-filter:blur(8px); border-radius:14px;
    display:flex; flex-direction:column; gap:6px; font-size:14px; }
  #ui h2 { margin:8px 0 2px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.6; }
  #ui h2:first-child { margin-top:0; }
  #ui .row { display:grid; grid-template-columns:1fr auto; align-items:center; }
  #ui label { font-weight:600; }
  #ui output { font-variant-numeric:tabular-nums; opacity:.7; text-align:right; }
  #ui input[type=range] { width:100%; margin:0 0 6px; }
  .seg, .stack { display:flex; gap:6px; }
  .stack { flex-direction:column; }
  button, select { padding:8px; border:0; border-radius:8px; background:var(--ink); color:var(--bg1); font:inherit; cursor:pointer; }
  select { width:100%; }
  .seg button { flex:1; padding:8px 4px; opacity:.5; font-size:13px; }
  .seg button.on { opacity:1; outline:2px solid var(--ink); outline-offset:2px; }
  .colors { display:flex; gap:8px; align-items:center; }
  .colors input[type=color] { flex:1; height:34px; padding:0; border:0; border-radius:8px; background:none; cursor:pointer; }
  #intro { position:fixed; inset:0; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; text-align:center; background:radial-gradient(ellipse at 50% 30%, var(--bg1), var(--bg2)); transition:opacity .6s, transform .6s; }
  #intro.leaving { opacity:0; transform:scale(1.06); pointer-events:none; }
  #intro h1 { margin:0; font-size:clamp(34px, 8vw, 78px); letter-spacing:-.02em; line-height:1; position:relative; z-index:3;
    text-shadow:0 2px 4px rgba(0,0,0,.18), 0 8px 18px rgba(0,0,0,.22), 0 18px 48px rgba(0,0,0,.28); }
  #intro p { margin:0; opacity:.6; font-size:15px; position:relative; z-index:2; }
  #intro h1::before { content:''; position:absolute; inset:-14px -44px; z-index:-1; border-radius:999px; background:var(--bg2); filter:blur(22px); opacity:.92; }
  #introMusic { position:relative; z-index:3; padding:8px 18px; border-radius:999px; font-size:15px; }
  #introMusic[aria-pressed="false"] { opacity:.55; }
  #spinBtn { position:relative; z-index:3; padding:16px 40px; font-size:22px; font-weight:700; border-radius:999px;
    box-shadow:0 6px 0 rgba(0,0,0,.25); transition:transform .1s, box-shadow .1s; animation:pulse 1.6s ease-in-out infinite; }
  #spinBtn:hover { transform:translateY(-2px) scale(1.04); }
  #spinBtn:active { transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.25); animation:none; }
  @keyframes pulse { 50% { transform:scale(1.06); } }
  #beans { position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:1; }
  .bean { position:absolute; left:0; top:0; cursor:pointer; pointer-events:auto; transform-origin:50% 100%; will-change:transform; }
  .bean svg { display:block; width:100%; height:auto; overflow:visible; filter:drop-shadow(0 4px 3px rgba(0,0,0,.18)); }
  @media (prefers-reduced-motion: reduce) { #spinBtn { animation:none; } }
  #hint { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:50; pointer-events:none; opacity:0;
    padding:10px 22px; border-radius:999px; font-size:clamp(18px,3.2vw,28px); font-weight:700; color:#fff; white-space:nowrap;
    background:rgba(0,0,0,.35); backdrop-filter:blur(6px); text-shadow:0 2px 8px rgba(0,0,0,.5); }
  #hint.show { animation:hintflash 1s ease-in-out infinite; }
  @keyframes hintflash { 0%,100% { opacity:.15; } 50% { opacity:1; } }
  #follow { position:fixed; right:16px; bottom:12px; font-size:13px; opacity:.6; transition:opacity .2s; }
  #follow:hover { opacity:1; }
  #follow { color:inherit; text-decoration:none; }
  #follow:hover { text-decoration:underline; }
  #credit { position:fixed; left:16px; bottom:12px; font-size:12px; opacity:.4; transition:opacity .2s; }
  #credit:hover { opacity:.85; }
  #credit a { color:inherit; text-decoration:none; }
  #credit a:hover { text-decoration:underline; }
  [hidden] { display:none !important; }
  @media (max-width:600px) { #ui { width:140px; right:8px; padding:10px; font-size:12px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint" aria-hidden="true">Click and drag me</div>
<a id="follow" href="https://www.twitch.tv/wakethebean" target="_blank" rel="noopener noreferrer">Follow wakethebean</a>
<div id="credit">Music: <a href="https://www.youtube.com/watch?v=WfRkhVNIg8U" target="_blank" rel="noopener noreferrer">&ldquo;Bean Buffet&rdquo; by Scoochie Boochie</a></div>
<div id="ui">
  <h2>Photo</h2>
  <div class="seg" id="photoSeg">
    <button data-photo="face" class="on">Face</button>
    <button data-photo="femmique">Femmique</button>
  </div>
  <button id="upload">Upload your own</button>
  <input id="file" type="file" accept="image/*" hidden>

  <h2>Empty space</h2>
  <select id="bgStyle" aria-label="Empty space style">
    <option value="rainbow">Rainbow</option>
    <option value="sunset">Sunset</option>
    <option value="ocean">Ocean</option>
    <option value="pastel">Pastel</option>
    <option value="solid">Solid colour</option>
    <option value="two">Two colours</option>
    <option value="none">Empty (see-through)</option>
  </select>
  <div class="colors" id="colorRow" hidden>
    <input id="c1" type="color" value="#e5483f" aria-label="Colour 1">
    <input id="c2" type="color" value="#f2d34f" aria-label="Colour 2" hidden>
  </div>

  <h2>Music</h2>
  <button id="music" aria-pressed="false">&#9835; Music: off</button>
  <div class="row"><label for="vol">Volume</label><output></output></div>
  <input id="vol" type="range" min="0" max="1" step="0.01" value="0.25">
  <audio id="song" src="bean-buffet.mp3" loop preload="auto"></audio>

  <h2>Spinner</h2>
  <div class="row"><label for="twist">Twist</label><output></output></div>
  <input id="twist" type="range" min="0" max="1" step="0.01" value="0.8">
  <div class="row"><label for="taper">Pinch</label><output></output></div>
  <input id="taper" type="range" min="0" max="0.9" step="0.01" value="0.15">
  <div class="row"><label for="speed">Spin</label><output></output></div>
  <input id="speed" type="range" min="-3" max="3" step="0.05" value="0.5">
  <div class="stack"><button id="flat">Show flat photo</button><button id="go">Spiral again</button><button id="reset">Reset</button></div>
</div>
<div id="intro">
  <div id="beans" aria-hidden="true"></div>
  <h1>Spin the Bean</h1>
  <button id="spinBtn">Press to spin</button>
  <button id="introMusic" aria-pressed="true">&#9835; Music: on</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

const PALETTES = {
  rainbow: [[0,'#f2d34f'],[0.14,'#f5c242'],[0.28,'#ef7d4a'],[0.42,'#e5483f'],[0.55,'#b04aa0'],[0.68,'#5a63c4'],[0.78,'#3a8fc9'],[0.86,'#f2d34f'],[0.93,'#ef7d4a'],[1,'#e5483f']],
  sunset:  [[0,'#ffd36e'],[0.3,'#ff8a5b'],[0.6,'#e0446a'],[0.85,'#7b3f9e'],[1,'#3a2a6b']],
  ocean:   [[0,'#bdf2e6'],[0.35,'#4fc3d9'],[0.7,'#2a74c9'],[1,'#17306b']],
  pastel:  [[0,'#ffd6e0'],[0.25,'#ffe9c2'],[0.5,'#d5f2d0'],[0.75,'#c7e3ff'],[1,'#e2d4ff']]
};
const $ = id => document.getElementById(id);
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
camera.position.set(0, 0, 8.5);
scene.add(new THREE.AmbientLight(0xffffff, 0.95));
const sun = new THREE.DirectionalLight(0xffffff, 0.6); sun.position.set(3, 4, 6); scene.add(sun);

const N = 110;
const pivot = new THREE.Group(); scene.add(pivot);
let rods = [], W = 5, H = 3, cv = null, g = null, curImg = null;

const string = new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.012,2.2,6), new THREE.MeshBasicMaterial({color:0x777777}));
scene.add(string);

function paintBackground() {
  if (!cv) return;
  g.clearRect(0, 0, cv.width, cv.height);
  const style = $('bgStyle').value;
  if (style !== 'none') {
    if (PALETTES[style]) {
      const gr = g.createLinearGradient(0, 0, 0, cv.height);
      PALETTES[style].forEach(([o, c]) => gr.addColorStop(o, c));
      g.fillStyle = gr;
    } else if (style === 'solid') {
      g.fillStyle = $('c1').value;
    } else {
      const gr = g.createLinearGradient(0, 0, 0, cv.height);
      gr.addColorStop(0, $('c1').value); gr.addColorStop(1, $('c2').value);
      g.fillStyle = gr;
    }
    g.fillRect(0, 0, cv.width, cv.height);
  }
  g.drawImage(curImg, 0, 0, cv.width, cv.height);
  for (const m of rods) m.userData.tex.needsUpdate = true;
}

function clearRods() {
  for (const m of rods) { pivot.remove(m); m.userData.tex.dispose(); m.material.dispose(); }
  if (rods[0]) rods[0].geometry.dispose();
  rods = [];
}

function setImage(img) {
  curImg = img;
  const aspect = img.width / img.height;
  W = Math.min(5.2, 4.3 * aspect); H = W / aspect;
  const k = Math.min(1, 1024 / Math.max(img.width, img.height));
  cv = document.createElement('canvas');
  cv.width = Math.max(2, Math.round(img.width * k)); cv.height = Math.max(2, Math.round(img.height * k));
  g = cv.getContext('2d');
  clearRods();
  const base = new THREE.CanvasTexture(cv);
  base.anisotropy = 4;
  const rowH = H / N, geo = new THREE.BoxGeometry(1, rowH * 0.8, rowH * 0.8);
  for (let i = 0; i < N; i++) {
    const tex = base.clone();
    tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.repeat.y = 1 / N;
    tex.offset.y = 1 - (i + 1) / N;
    const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({map:tex, alphaTest:0.5}));
    mesh.position.y = H / 2 - rowH * (i + 0.5);
    mesh.userData = {t: 1 - 2 * (i + 0.5) / N, tex};
    pivot.add(mesh); rods.push(mesh);
  }
  string.position.y = H / 2 + 1.1;
  paintBackground();
}

function loadPhoto(src) {
  const img = new Image();
  img.onload = () => setImage(img);
  img.src = src;
}

// ---- UI ----
const bind = id => { const r = $(id), o = r.previousElementSibling.lastElementChild;
  const f = () => o.textContent = (+r.value).toFixed(2); r.addEventListener('input', f); f(); return r; };
const twist = bind('twist'), taper = bind('taper'), speed = bind('speed');
const show = (id, v) => { const r = $(id); r.previousElementSibling.lastElementChild.textContent = (+v).toFixed(2); r.value = v; };

document.querySelectorAll('#photoSeg button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#photoSeg button').forEach(x => x.classList.toggle('on', x === b));
  loadPhoto(PHOTOS[b.dataset.photo]);
});
$('upload').onclick = () => $('file').click();
$('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  document.querySelectorAll('#photoSeg button').forEach(x => x.classList.remove('on'));
  const url = URL.createObjectURL(f);
  const img = new Image();
  img.onload = () => { setImage(img); URL.revokeObjectURL(url); };
  img.src = url;
  e.target.value = '';
};
function syncBgUI() {
  const s = $('bgStyle').value;
  $('colorRow').hidden = !(s === 'solid' || s === 'two');
  $('c2').hidden = s !== 'two';
  paintBackground();
}
$('bgStyle').onchange = syncBgUI;
$('c1').oninput = $('c2').oninput = paintBackground;

let spin = 0, last = performance.now(), dragX = 0, dragY = 0, dragging = false, px = 0, py = 0, tween = null;

function pose(tw, tp, sp) {
  for (const m of rods) {
    const t = m.userData.t, r = 1 - tp * (1 - t * t);
    m.rotation.y = sp + tw * Math.PI * t;
    m.scale.x = W * r;
    m.userData.tex.repeat.x = r;
    m.userData.tex.offset.x = (1 - r) / 2;
  }
}
const animateTo = (tw, spd) => { tween = {t0: performance.now(), from: {tw: +twist.value, sp: spin}, tw, spd}; };
$('flat').onclick = () => animateTo(0, 0);
$('go').onclick = () => animateTo(0.8, 0.5);
$('reset').onclick = () => { tween = null; show('twist', 0.8); show('taper', 0.15); show('speed', 0.5); dragX = 0; dragY = 0; };

canvas.addEventListener('pointerdown', e => { dragging = true; px = e.clientX; py = e.clientY; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointerup', () => dragging = false);
canvas.addEventListener('pointermove', e => { if (!dragging) return;
  dragX += (e.clientX - px) * 0.008; dragY = Math.max(-0.6, Math.min(0.6, dragY + (e.clientY - py) * 0.004));
  px = e.clientX; py = e.clientY; });

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.position.z = w / h < 0.9 ? 12 : 8.5;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

let introOpen = true;   // don't draw the 3D spinner behind the intro screen: keeps the beans smooth
function frame(now) {
  if (introOpen) { last = now; requestAnimationFrame(frame); return; }
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  let spd = +speed.value;
  if (tween) {
    const k = Math.min(1, (now - tween.t0) / 1400), e = k * k * (3 - 2 * k);
    show('twist', tween.from.tw + (tween.tw - tween.from.tw) * e);
    if (tween.spd === 0) {
      const target = Math.round(tween.from.sp / (2 * Math.PI)) * 2 * Math.PI;
      spin = tween.from.sp + (target - tween.from.sp) * e; spd = 0;
    }
    if (k >= 1) { show('speed', tween.spd === 0 ? 0 : (+speed.value === 0 ? 0.5 : +speed.value)); tween = null; }
  }
  spin += spd * dt;
  pose(+twist.value, +taper.value, spin);
  pivot.rotation.y = dragX; pivot.rotation.x = dragY;
  pivot.position.y = Math.sin(now / 1400) * 0.04;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
// ---- music ----
const song = $('song'), musicBtn = $('music');
const vol = bind('vol'); song.volume = +vol.value;
vol.addEventListener('input', () => song.volume = +vol.value);
function setMusicUI(on) { musicBtn.setAttribute('aria-pressed', on); musicBtn.textContent = '♫ Music: ' + (on ? 'on' : 'off'); }
let userChose = false;
musicBtn.onclick = () => {
  userChose = true;
  if (song.paused) song.play().then(() => setMusicUI(true)).catch(() => setMusicUI(false));
  else { song.pause(); setMusicUI(false); }
};
// Music only starts when the visitor presses "Press to spin" (or the Music button).

// ---- intro: jumping beans + "Press to spin" ----
(function () {
  const colours = ['#e8a06a', '#c0583a', '#f2d9a0', '#8fbf6a', '#8b5a3c', '#f29ab4', '#b58be0'];
  const mouths = [
    '<path d="M38 39 Q44 46 50 39" fill="none" stroke="#3b2418" stroke-width="2" stroke-linecap="round"/>',
    '<path d="M37 38 Q44 52 51 38Z" fill="#7a2a2a" stroke="#3b2418" stroke-width="1.5" stroke-linejoin="round"/>',
    '<path d="M37 39 Q40.5 44 44 39 Q47.5 44 51 39" fill="none" stroke="#3b2418" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
  ];
  const beanSVG = (c, m) => `<svg viewBox="4 6 82 64"><path d="M12 40C8 22 22 12 36 20C44 25 52 25 60 18C74 8 86 20 82 38C79 56 62 66 44 66C26 66 14 58 12 40Z" fill="${c}"/>
    <path d="M44 66C26 66 14 58 12 40C20 54 40 58 58 52C70 48 78 42 82 38C79 56 62 66 44 66Z" fill="#000" fill-opacity=".1"/>
    <path d="M17 34C17 27 22 21 29 21" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3.5" stroke-linecap="round"/>
    <g transform="translate(3 13)">
    <ellipse cx="34" cy="30" rx="3.4" ry="4.4" fill="#2b1d16"/><ellipse cx="54" cy="30" rx="3.4" ry="4.4" fill="#2b1d16"/>
    <circle cx="35.2" cy="28.4" r="1.3" fill="#fff"/><circle cx="55.2" cy="28.4" r="1.3" fill="#fff"/>
    <circle cx="27" cy="38" r="4.2" fill="#ff7a96" fill-opacity=".55"/><circle cx="61" cy="38" r="4.2" fill="#ff7a96" fill-opacity=".55"/>
    ${m}</g></svg>`;
  const box = document.getElementById('beans'), n = 9;
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0.45 : 1;   // gentler, never frozen
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const beans = [];
  const area = () => ({w: box.clientWidth || innerWidth, h: box.clientHeight || innerHeight});

  // Beans never stand still: they bounce on the spot a few times, then hop somewhere new.
  function pickTarget(b) {
    b.from = {x: b.x, y: b.y};
    if (b.bounces > 0) {
      b.bounces--;
      b.to = {x: b.x, y: b.y}; b.dur = rand(0.6, 0.85); b.lift = rand(25, 45) * calm;
    } else {
      const {w, h} = area(), ang = rand(0, Math.PI * 2), dist = rand(110, 280) * calm;
      b.to = {x: clamp(b.x + Math.cos(ang) * dist, b.size * 0.6, w - b.size * 0.6),
              y: clamp(b.y + Math.sin(ang) * dist * 0.6, h * 0.3, h - 18)};
      b.dur = rand(1.3, 2.1); b.lift = rand(60, 120) * calm;
      b.bounces = Math.floor(rand(1, 4));
    }
    b.t = 0; b.state = 'hop';
  }

  for (let i = 0; i < n; i++) {
    const el = document.createElement('div'), size = rand(70, 120);
    el.className = 'bean';
    el.style.width = size + 'px';
    el.innerHTML = beanSVG(colours[i % colours.length], mouths[i % mouths.length]);
    box.appendChild(el);
    const {w, h} = area();
    const b = {el, size, x: rand(size, Math.max(size + 1, w - size)), y: rand(h * 0.35, h - 18),
               state: 'wait', t: 0, wait: rand(0, 1.2), bounces: Math.floor(rand(0, 3)), boing: -1, tilt: rand(-6, 6), h: size * 64 / 82};
    el.addEventListener('click', () => { b.boing = 0; });
    beans.push(b);
  }

  function render(b) {
    const {h} = area();
    let x = b.x, y = b.y, arc = 0, sx = 1, sy = 1, rot = b.tilt;
    if (b.state === 'hop') {
      const p = b.t / b.dur, e = p * p * (3 - 2 * p);
      x = b.from.x + (b.to.x - b.from.x) * e;
      y = b.from.y + (b.to.y - b.from.y) * e;
      arc = 4 * p * (1 - p) * b.lift;
      if (p < 0.12) { sx = 1.1; sy = 0.9; }                       // crouch
      else if (p > 0.88) { sx = 1.12; sy = 0.86; }                // land
      else { const s = Math.sin(p * Math.PI); sx = 1 - 0.06 * s; sy = 1 + 0.1 * s; }
      const dx = b.to.x - b.from.x;
      rot += (dx === 0 ? (b.tilt > 0 ? 5 : -5) : (dx > 0 ? 10 : -10)) * Math.sin(p * Math.PI);
    } else {
      sy = 1 - 0.03 * Math.sin(performance.now() / 300 + b.size);  // little breathing
      sx = 2 - sy;
    }
    if (b.boing >= 0) {
      const q = b.boing / 0.9;
      arc += 150 * Math.sin(Math.PI * Math.min(q, 1));
      rot += 360 * Math.min(q, 1);
    }
    const depth = 0.7 + 0.5 * (y / h);                              // lower on screen = bigger
    b.el.style.zIndex = Math.round(y);
    b.el.style.transform = `translate3d(${(x - b.size / 2).toFixed(1)}px, ${(y - b.h - arc).toFixed(1)}px, 0) scale(${(sx * depth).toFixed(3)}, ${(sy * depth).toFixed(3)}) rotate(${rot.toFixed(1)}deg)`;
  }

  let last = performance.now();
  function tick(now) {
    if (!box.isConnected) return;
    requestAnimationFrame(tick);
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    for (const b of beans) {
      if (b.boing >= 0) { b.boing += dt; if (b.boing > 0.9) b.boing = -1; }
      if (b.state === 'wait') { b.wait -= dt; if (b.wait <= 0) pickTarget(b); }
      else { b.t += dt; if (b.t >= b.dur) { b.x = b.to.x; b.y = b.to.y; pickTarget(b); } }
      render(b);
    }
  }
  requestAnimationFrame(tick);
  let introMusicOn = true;
  const introMusic = document.getElementById('introMusic');
  introMusic.onclick = () => {
    introMusicOn = !introMusicOn;
    introMusic.setAttribute('aria-pressed', introMusicOn);
    introMusic.textContent = '♫ Music: ' + (introMusicOn ? 'on' : 'off');
  };
  const intro = document.getElementById('intro');
  document.getElementById('spinBtn').onclick = () => {
    introOpen = false;
    // soft flashing hint for 3 seconds once the spinner appears (ends early if they drag)
    const hint = document.getElementById('hint');
    const endHint = () => {
      const o = getComputedStyle(hint).opacity;            // fade out from wherever the flash is
      hint.classList.remove('show'); hint.style.opacity = o; void hint.offsetWidth;
      hint.style.transition = 'opacity .4s'; hint.style.opacity = 0;
    };
    setTimeout(() => { hint.classList.add('show'); setTimeout(endHint, 3000); }, 450);
    canvas.addEventListener('pointerdown', endHint, {once: true});
    intro.classList.add('leaving');
    setTimeout(() => intro.remove(), 700);
    if (introMusicOn && !userChose && song.paused) song.play().then(() => setMusicUI(true)).catch(() => {});
  };
})();
